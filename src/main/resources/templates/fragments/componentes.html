<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <header th:fragment="encabezado" class="encabezado-clinica py-4 text-center">
        <div class="container">
            <h1 class="h2 mb-1" th:text="#{encabezado.titulo}">Título</h1>
            <p class="mb-0 texto-suave" th:text="#{encabezado.lema}">Lema</p>
        </div>
    </header>

    <nav th:fragment="barraNavegacion" class="navbar navbar-expand-lg navbar-clinica">
        <div class="container">
            <a class="navbar-brand text-info" th:href="@{/}">🐾</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                    aria-expanded="false" aria-label="Menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" th:text="#{nav.inicio}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/tipos}" th:text="#{nav.tipos}">Tipos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/servicios}" th:text="#{nav.servicios}">Servicios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/citas}" th:text="#{nav.citas}">Citas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/#consultas}" th:text="#{nav.consultas}">Consultas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <footer th:fragment="pieDePagina" class="pie-clinica mt-auto py-4">
        <div class="container text-center">
            <p class="mb-1" th:text="#{pie.direccion}">Dirección</p>
            <p class="mb-1" th:text="#{pie.telefono}">Teléfono</p>
            <p class="mb-1" th:text="#{pie.horario}">Horario</p>
            <small th:text="#{pie.derechos}">Derechos</small>
        </div>
    </footer>

    <div th:fragment="notificaciones" class="toast-container position-fixed bottom-0 end-0 p-3">
        <div th:if="${mensajeExito}" class="toast align-items-center text-bg-success border-0"
             role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" th:text="${mensajeExito}">Éxito</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast" aria-label="Cerrar"></button>
            </div>
        </div>
        <div th:if="${mensajeError}" class="toast align-items-center text-bg-danger border-0"
             role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" th:text="${mensajeError}">Error</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast" aria-label="Cerrar"></button>
            </div>
        </div>
    </div>

</body>
</html>
