<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: estructura(~{::title}, ~{::main})}">
<head>
    <title>Consulta de citas | Clínica Veterinaria</title>
</head>
<body>
<main class="container my-5">

    <h2 class="h3 text-info mb-4">Consulta ampliada de citas</h2>

    <div class="tarjeta-clinica p-3 mb-4">
        <form method="get" th:action="@{/citas/consulta}" class="row g-3 align-items-end">
            <div class="col-md-4">
                <label for="idTipo" class="form-label">Tipo de servicio</label>
                <select id="idTipo" name="idTipo" class="form-select">
                    <option value="">Todos</option>
                    <option th:each="tipo : ${listaTipos}"
                            th:value="${tipo.idTipo}"
                            th:text="${tipo.nombreTipo}"
                            th:selected="${idTipo != null and idTipo == tipo.idTipo}">Tipo</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="desde" class="form-label">Desde</label>
                <input type="date" id="desde" name="desde" class="form-control" th:value="${desde}">
            </div>
            <div class="col-md-3">
                <label for="hasta" class="form-label">Hasta</label>
                <input type="date" id="hasta" name="hasta" class="form-control" th:value="${hasta}">
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-acento">
                    <i class="bi bi-search"></i> Consultar
                </button>
            </div>
        </form>
    </div>

    <div class="tarjeta-clinica p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle tabla-clinica mb-0">
                <thead>
                    <tr>
                        <th>Mascota</th>
                        <th>Propietario</th>
                        <th>Fecha</th>
                        <th>Servicio</th>
                        <th>Tipo</th>
                        <th>Duración</th>
                        <th class="text-end">Precio</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cita : ${listaCitas}">
                        <td th:text="${cita.nombreMascota}">Mascota</td>
                        <td th:text="${cita.nombrePropietario}">Propietario</td>
                        <td th:text="${#temporals.format(cita.fechaCita, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td th:text="${cita.servicio.nombreServicio}">Servicio</td>
                        <td th:text="${cita.servicio.tipoServicio.nombreTipo}">Tipo</td>
                        <td th:text="${cita.servicio.duracionMinutos} + ' min'">30 min</td>
                        <td class="text-end"
                            th:text="${#numbers.formatDecimal(cita.servicio.precioServicio, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listaCitas)}">
                        <td colspan="7" class="text-center texto-suave">No hay citas que coincidan con la consulta.</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <th colspan="3" th:text="'Citas encontradas: ' + ${#lists.size(listaCitas)}">Citas encontradas: 0</th>
                        <th colspan="4" class="text-end"
                            th:text="'Total estimado: ' + ${#numbers.formatDecimal(totalEstimado, 1, 'COMMA', 2, 'POINT')}">Total estimado: 0.00</th>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</main>
</body>
</html>
