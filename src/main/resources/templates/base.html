<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"
      th:fragment="estructura(tituloPagina, contenidoPagina)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${tituloPagina}">Clínica Veterinaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <header th:replace="~{fragments/componentes :: encabezado}"></header>
    <nav th:replace="~{fragments/componentes :: barraNavegacion}"></nav>

    <main th:replace="${contenidoPagina}"></main>

    <footer th:replace="~{fragments/componentes :: pieDePagina}"></footer>
    <div th:replace="~{fragments/componentes :: notificaciones}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('.toast').forEach(function (elemento) {
            new bootstrap.Toast(elemento, { delay: 4500 }).show();
        });
    </script>
</body>
</html>
