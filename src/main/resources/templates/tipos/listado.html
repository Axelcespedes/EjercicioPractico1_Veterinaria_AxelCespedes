<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: estructura(~{::title}, ~{::main})}">
<head>
    <title>Tipos de Servicio | Clínica Veterinaria</title>
</head>
<body>
<main class="container my-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 text-info mb-0">Tipos de Servicio</h2>
        <a class="btn btn-acento" th:href="@{/tipos/nuevo}">
            <i class="bi bi-plus-lg"></i> Nuevo tipo
        </a>
    </div>

    <div class="tarjeta-clinica p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle tabla-clinica mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th class="text-center">Servicios asociados</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tipo : ${listaTipos}">
                        <td th:text="${tipo.idTipo}">1</td>
                        <td th:text="${tipo.nombreTipo}">Nombre</td>
                        <td th:text="${tipo.detalleTipo}">Descripción</td>
                        <td class="text-center">
                            <span class="badge text-bg-info"
                                  th:text="${#lists.size(tipo.listaServicios)}">0</span>
                        </td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-info"
                               th:href="@{/tipos/editar/{id}(id=${tipo.idTipo})}">
                                <i class="bi bi-pencil"></i> Editar
                            </a>
                            <button type="button" class="btn btn-sm btn-outline-danger"
                                    data-bs-toggle="modal" data-bs-target="#modalEliminar"
                                    th:attr="data-nombre=${tipo.nombreTipo},data-accion=@{/tipos/eliminar/{id}(id=${tipo.idTipo})}">
                                <i class="bi bi-trash"></i> Eliminar
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listaTipos)}">
                        <td colspan="5" class="text-center texto-suave">No hay tipos registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal de confirmación -->
    <div class="modal fade" id="modalEliminar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmar eliminación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    ¿Seguro que deseas eliminar el tipo <strong id="nombreAEliminar"></strong>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <form id="formularioEliminar" method="post">
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('modalEliminar').addEventListener('show.bs.modal', function (evento) {
            var boton = evento.relatedTarget;
            document.getElementById('nombreAEliminar').textContent = boton.getAttribute('data-nombre');
            document.getElementById('formularioEliminar').setAttribute('action', boton.getAttribute('data-accion'));
        });
    </script>
</main>
</body>
</html>
